name: Deploy All Packages (UPM + NPM)

on:
  release:
    types: [published] # 当你在 GitHub 页面点击 "Publish release" 时触发
  
  # 也可以手动触发，方便测试
  workflow_dispatch:

jobs:
  inspect-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # =======================================================
        # 【配置】在这里列出所有包的文件夹名称
        # =======================================================
        package: 
          - XRMODActionNotifier 
          # - XRMODAvatar 
          # - XRMODFoundation 
          # - XRMODGameServices 
          # - XRMODGoap 
          # - XRMODInput 
          # - XRMODNetcode 
          # - XRMODOpenXR 
          # - XRMODPhoton 
          # - XRMODQuestModule 
          # - XRMODRokidModule 
          # - XRMODSimulator 
          # - XRMODUIFramework 
          # - XRMODUnityFusion 
          # 添加更多包...

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取完整历史
          
      # 1. 准备 Node.js 环境 (新增步骤)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          # 如果发布到 npmjs.org:
          registry-url: 'https://registry.npmjs.org'
          # 如果发布到 GitHub Packages:
          # registry-url: 'https://npm.pkg.github.com'
          
      - name: Read Package Version
        id: meta
        run: |
          PKG_PATH="XRMODPackages/${{ matrix.package }}"
          VERSION=$(jq -r .version "$PKG_PATH/package.json")
          TAG_NAME="${{ matrix.package }}/$VERSION"
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split and Push UPM Branch
        # 无论版本是否更新，我们都更新 upm 分支的代码，确保它是最新的
        env:
          TARGET_BRANCH: "upm/${{ matrix.package }}"
        run: |
          echo "Syncing ${{ env.PKG_PATH }} to branch $TARGET_BRANCH"
          
          # 拆分分支
          git subtree split --prefix="${{ env.PKG_PATH }}" -b split-temp
          
          # 强制推送到 upm 分支 (用户通过 URL 安装通常指向这个分支的最新 commit)
          git push origin split-temp:$TARGET_BRANCH --force

      # 2. 发布到 NPM (新增步骤)
      - name: Publish to NPM
        # 只有新版本才发布到 NPM
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "Publishing ${{ matrix.package }} to NPM Registry..."
          
          # 进入包的目录
          cd ${{ env.PKG_PATH }}
          
          # 【关键】因为 npm publish 需要 .npmrc 里的认证信息
          # setup-node action 会自动生成 .npmrc，但我们这里直接运行即可
          
          # 运行发布命令
          # --access public 是必须的，除非你付费了私有包
          npm publish --access public
        env:
          # 这里的 Token 对应你在 setup-node 里配置的 registry
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 
          # 如果是用 GitHub Packages，这里用 ${{ secrets.GITHUB_TOKEN }}
