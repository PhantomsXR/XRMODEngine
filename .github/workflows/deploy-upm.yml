name: Deploy All Packages (UPM + NPM)

on:
  release:
    types: [published] # 当你在 GitHub 页面点击 "Publish release" 时触发
  
  # 也可以手动触发，方便测试
  workflow_dispatch:

jobs:
  inspect-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # =======================================================
        # 【配置】在这里列出所有包的文件夹名称
        # =======================================================
        package: 
          - XRMODActionNotifier 
          - XRMODAvatar 
          - XRMODFoundation 
          - XRMODGameServices 
          - XRMODGoap 
          - XRMODInput 
          - XRMODNetcode 
          - XRMODOpenXR 
          - XRMODPhoton 
          - XRMODQuestModule 
          - XRMODRokidModule 
          - XRMODSimulator 
          - XRMODUIFramework 
          - XRMODUnityFusion 
          # 添加更多包...

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取完整历史
          
      # 1. 准备 Node.js 环境 (新增步骤)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Read Package Version
        id: meta
        run: |
          PKG_PATH="XRMODPackages/${{ matrix.package }}"
          VERSION=$(jq -r .version "$PKG_PATH/package.json")
          TAG_NAME="${{ matrix.package }}/$VERSION"
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"


      # 2.无论版本是否更新，我们都更新 upm 分支的代码，确保它是最新的
      - name: Split and Push UPM Branch
        env:
          TARGET_BRANCH: "upm/${{ matrix.package }}"
        run: |
          echo "Syncing ${{ env.PKG_PATH }} to branch $TARGET_BRANCH"
          
          # 拆分分支
          git subtree split --prefix="${{ env.PKG_PATH }}" -b split-temp
          
          # 强制推送到 upm 分支 (用户通过 URL 安装通常指向这个分支的最新 commit)
          git push origin split-temp:$TARGET_BRANCH --force

      # 3. 发布到 NPM (新增步骤)
      # 3. 发布到 NPM (If New Version) - 修复版
      - name: Publish to NPM (If New Version)
        run: |
          cd ${{ env.PKG_PATH }}
          
          # 1. 准备工作：清理可能存在的干扰配置
          jq 'del(.publishConfig)' package.json > tmp.json && mv tmp.json package.json
          
          # 2. 获取包信息
          PACKAGE_NAME=$(jq -r .name package.json)
          LOCAL_VERSION=$(jq -r .version package.json)
          
          echo "🔍 Checking package: $PACKAGE_NAME"
          echo "📝 Local Version: '$LOCAL_VERSION'"

          # 3. 检查 NPM 上是否存在该版本 (优化点：使用 --json 获取确切结果)
          # 如果包不存在或版本不存在，npm view --json 会返回空或者错误，我们捕获它
          # 仅获取 version 字段，并去除所有引号和空白
          REMOTE_VERSION=$(npm view "$PACKAGE_NAME@$LOCAL_VERSION" version --json 2>/dev/null | jq -r . || echo "")
          
          # 确保 REMOTE_VERSION 为纯净字符串 (去除 null 字符串如果 jq 返回 null)
          if [ "$REMOTE_VERSION" == "null" ]; then REMOTE_VERSION=""; fi

          echo "☁️  Remote Version found: '$REMOTE_VERSION'"

          # 4. 逻辑判断
          if [ "$REMOTE_VERSION" == "$LOCAL_VERSION" ]; then
            echo "✅ Version matches. Skipping publish."
            # 显式退出当前 step，但不标记为失败 (exit 0)
            exit 0
          else
            if [ -z "$REMOTE_VERSION" ]; then
                echo "🚀 Version not found on NPM (New Release)."
            else
                # 理论上不应该走到这里，除非 npm view 返回了奇怪的东西，但我们当作不匹配处理
                echo "⚠️ Version mismatch or other status. Proceeding to publish."
            fi
            
            echo "📦 Publishing..."
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
