name: Deploy Independent Package

on:
  push:
    # 触发规则：匹配 "任意字符/任意字符" 的格式
    # 例如: XRMODFoundation/1.0.5
    tags:
      - '*/*' 

jobs:
  deploy-specific:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Tag and Setup Environment
        id: parse
        run: |
          # 1. 获取完整 Tag，例如 XRMODFoundation/1.0.5
          FULL_TAG=${GITHUB_REF#refs/tags/}
          
          # 2. 解析包名 (斜杠前的内容)
          PKG_NAME=$(echo $FULL_TAG | cut -d'/' -f1)
          
          # 3. 解析版本号 (斜杠后的内容)
          VERSION=$(echo $FULL_TAG | cut -d'/' -f2)
          
          echo "Target Package: $PKG_NAME"
          echo "Target Version: $VERSION"
          
          # 4. 验证目录是否存在
          PKG_PATH="XRMODPackages/$PKG_NAME"
          if [ ! -d "$PKG_PATH" ]; then
            echo "::error::Directory $PKG_PATH does not exist! Check your tag spelling."
            exit 1
          fi

          # 5. 导出变量给后续步骤使用
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # 设置 Git 身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update package.json Version
        run: |
          echo "Updating $PKG_NAME to version $VERSION"
          
          # 修改指定包的 package.json
          jq --arg v "${{ env.VERSION }}" '.version = $v' "${{ env.PKG_PATH }}/package.json" > tmp.json && mv tmp.json "${{ env.PKG_PATH }}/package.json"
          
          # 提交修改 (为了让 git subtree 包含这个变动)
          git add "${{ env.PKG_PATH }}/package.json"
          git commit -m "Bump ${{ env.PKG_NAME }} version to ${{ env.VERSION }}"

      - name: Split and Push
        env:
          TARGET_BRANCH: "upm/${{ env.PKG_NAME }}"
        run: |
          echo "Deploying to branch: $TARGET_BRANCH"
          
          # 拆分分支
          git subtree split --prefix="${{ env.PKG_PATH }}" -b split-temp
          
          # 推送到 upm 分支
          git push origin split-temp:$TARGET_BRANCH --force
          
          # 打上特定 Tag (可选，方便用户引用)
          # Tag 格式保持原样: XRMODFoundation/1.0.5
          git tag ${{ env.PKG_NAME }}/${{ env.VERSION }} split-temp
          git push origin ${{ env.PKG_NAME }}/${{ env.VERSION }} --force
